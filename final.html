<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>final project</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: red;
            color: orange;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: yellow;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }
        input[type="text"]:focus {
            border-color:black;
        }
        button {
            padding: 12px 20px;
            background-color:white;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
        button:hover {
            background-color:green;
        }
        ul {
            list-style: none;
        }
        li {
            background:pink;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solidViolet;
        }
        li.completed {
            text-decoration: line-through;
            opacity: 0.6;
            border-left-color: red;
        }
        .delete-btn {
            background-color:black;
            padding: 6px 12px;
            font-size: 14px;
        }
        .delete-btn:hover {
            background-color:green;
        }
        .stats {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color:white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>final project</h2>
 
    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Add a new task (e.g., C++ Arrays)...">
        <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

    <div class="stats" id="stats">
        Total Tasks: 0 | Completed: 0
    </div>
</div>

<script>
     JSON.parse(localStorage.getItem('myTasks')) || [];

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = '';
        
        let completedCount = 0;

        tasks.forEach((task, index) => {
            if (task.completed) completedCount++;

            const li = document.createElement('li');
            if (task.completed) li.classList.add('completed');

            li.innerHTML = `
                <span onclick="toggleTask(${index})" style="cursor:pointer; flex:1;">${task.text}</span>
                <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
            `;
            list.appendChild(li);
        });

        document.getElementById('stats').innerText = `Total Tasks: ${tasks.length} | Completed: ${completedCount}`;
        
        localStorage.setItem('myTasks', JSON.stringify(tasks));
    }

    function addTask() {
        const input = document.getElementById('taskInput');
        const text = input.value.trim();

        if (text !== '') {
            tasks.push({ text: text, completed: false });
            input.value = '';
            renderTasks();
        }
    }

function toggleTask(index) {
        tasks[index].completed = !tasks[index].completed;
        renderTasks();
    }
 deleteTask(index) {
        tasks.splice(index, 1);
        renderTasks();
    }

    renderTasks();
</script>

</body>
</html>
